name: Application Tests

on:
  pull_request:
  push:
    branches:
      - main
      - master
  schedule:
    - cron: "0 18 * * *"
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Install dependencies
        run: python -m pip install -r requirements.txt

      - name: Run application tests
        run: python -m pytest -q

  browser-regression:
    runs-on: ubuntu-latest
    env:
      SECRET_KEY: browser-test-secret
      SUPABASE_URL: http://127.0.0.1:54321
      SUPABASE_ANON_KEY: browser.test.anon
      SUPABASE_SERVICE_KEY: browser.test.service
      SUPABASE_JWT_SECRET: browser-test-jwt-secret
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm

      - name: Install Python dependencies
        run: |
          python -m venv .venv
          .venv/bin/python -m pip install -r requirements.txt

      - name: Install Node dependencies
        run: npm ci

      - name: Install Chromium
        run: npx playwright install --with-deps chromium

      - name: Run deterministic browser regressions
        run: npm run test:browser:ci

      - name: Upload Playwright report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 14

  cross-browser-regression:
    if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    env:
      PLAYWRIGHT_CROSS_BROWSER: "1"
      SECRET_KEY: browser-test-secret
      SUPABASE_URL: http://127.0.0.1:54321
      SUPABASE_ANON_KEY: browser.test.anon
      SUPABASE_SERVICE_KEY: browser.test.service
      SUPABASE_JWT_SECRET: browser-test-jwt-secret
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm

      - name: Install Python dependencies
        run: |
          python -m venv .venv
          .venv/bin/python -m pip install -r requirements.txt

      - name: Install Node dependencies
        run: npm ci

      - name: Install Chromium and WebKit
        run: npx playwright install --with-deps chromium webkit

      - name: Run cross-browser regressions
        run: npm run test:browser:ci

      - name: Upload cross-browser Playwright report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: cross-browser-playwright-report
          path: playwright-report/
          retention-days: 14

  carousel-visual-regression:
    if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
    runs-on: macos-latest
    env:
      SECRET_KEY: browser-test-secret
      SUPABASE_URL: http://127.0.0.1:54321
      SUPABASE_ANON_KEY: browser.test.anon
      SUPABASE_SERVICE_KEY: browser.test.service
      SUPABASE_JWT_SECRET: browser-test-jwt-secret
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm

      - name: Install Python dependencies
        run: |
          python -m venv .venv
          .venv/bin/python -m pip install -r requirements.txt

      - name: Install Node dependencies
        run: npm ci

      - name: Install Chromium
        run: npx playwright install chromium

      - name: Run carousel visual regressions
        run: npm run test:visual:carousel

      - name: Upload visual Playwright report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: carousel-visual-playwright-report
          path: playwright-report/
          retention-days: 14
